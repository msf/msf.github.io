<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="100%" style="max-width:760px;height:auto" role="img" aria-label="Decode throughput, Framework 13 versus R9700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
